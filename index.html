      <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.js" integrity="sha512-Xo0Jh8MsOn72LGV8kU5LsclG7SUzJsWGhXbWcYs2MAmChkQzwiW/yTQwdJ8w6UA9C6EVG18GHb/TrYpYCjyAQw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css" integrity="sha512-KXol4x3sVoO+8ZsWPFI/r5KBVB/ssCGB5tsv2nVOKwLg33wTFP3fmnXa47FdSVIshVTgsYk/1734xSk9aFIa4A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

      <!-- Fuentes de Google -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;700;900&display-swap" rel="stylesheet">

      <!-- Estilos personalizados -->
      <style>
        .padding_top {
          padding-top: 5em;
        }
        #subtitle-menu-content .ui.button {
          background-color: white;
        }

        #subtitle-menu-content .ui.button.active {
          background-color: white;
        }

        #subtitle-menu-content {
          margin-top: 1em;
        }

      </style>

      <!-- Google Analytics -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-JL67FDGSX2"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-JL67FDGSX2');

  </head>
  <body>
    <div class="ui fixed inverted menu">
      <div class="ui container">
        <a href="#" class="header item">
          <img class="logo" src="./gorre.jpg">
        </a>
        <a href="#" class="item">Rol de Gorre</a>
      </div>
    </div>

    <div class="ui main container padding_top">
      <div class="ui grid">
        <div class="row">
          <div id="subtitle-menu-content">
          </div>
        </div>
        <div class="center row">
          <div class="ui basic segment">
            <div id="card-content">
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      jQuery(() => {
        const GAMES_TSV_URL = 'https://docs.google.com/spreadsheets/d/1hX6Y0wqFcoyBsIQXkgypgogijbrTSqZRJGRw5Lqh9Ek/export?format=tsv';
        const cardContent = document.getElementById('card-content');
        const subTitleContent = document.getElementById('subtitle-menu-content');
        const _showCardsHtml = (cardsHtml) => cardContent.innerHTML = `<div class="ui stackable three column grid">${cardsHtml}</div>`;
        const _clearCardsHtml = () => cardContent.innerHTML = '';
        const _showSubTitleMenuHtml = (subTitleHtml) => subTitleContent.innerHTML = `
          <div class="ui center aligned grid">
            <div class="ui orange basic button active" data-value="">Todas</div>
            ${subTitleHtml}
          </div>
        `;

        // <div class="ui fluid tabular menu"><a class="active item" data-value="">Todas</a>${subTitleHtml}</div>`;
        const _deactivateAllSubTitleMenu = () => jQuery('#subtitle-menu-content .ui.button').removeClass('active').removeClass('orange').removeClass('basic');
        const _activateSubTitleMenu = (element) => jQuery(element).addClass('active').addClass('orange').addClass('basic');
        const _allSubTitles = (cards) => cards.map((card) => card.subTitle).filter((value, index, array) => array.indexOf(value) === index).sort();
        const _filterCardsBy = (subTitle) => (cards) => subTitle ? cards.filter((card) => card.subTitle === subTitle) : cards;
        const _renderSubtitleHtml = (subTitles) => subTitles.map(_subTitleTemplate).join('');
        const _renderCardsHtml = (cards) => cards.map(_cardTemplate).join('');
        const _subTitleTemplate = (subTitle) => `<div class="ui button" data-value="${subTitle}">${subTitle}</div>`;

        const _cardTemplate = ({
          imageUrl,
          title,
          subTitle,
          description,
          contentWarning,
          players,
          sessions,
          cost
        }) => {
          return `<div class="column"><div class="ui fluid card">
            <div class="image">
              <img src="${imageUrl}">
            </div>
            <div class="content">
              <div class="header">${title}</div>
              <div class="meta">
                <a>${subTitle}</a>
              </div>
              <div class="description">
                ${description}
              </div>
            </div>
            <div class="extra content">
              <div>
                <i class="user icon"></i>
                ${players}
              </div>
              <div>
                ${contentWarning}
              </div>
            </div>
          </div></div>`;
        };

        $.ajax({
          url: GAMES_TSV_URL,
          method: 'GET',
          dataType: 'text', // IMPORTANT for TSV
          success: function(tsvData) {
            let cards = tsvData.trim().split('\n').map(row => row.split('\t'));

            // 0: "Titulo"
            // 1: "Línea"
            // 2: "Género" -
            // 3: "Descripción"
            // 4: "Portada"
            // 5: "Aviso de contenido"
            // 6: "Jugadores"
            // 7: "Sesiones"
            // 8: "Jugar" -
            // 9: "Publicar en" -

            // Quitar la primera linea
            cards = cards.slice(1);
            const _parseData = (card) => {
              return {
                title: card[0],
                subTitle: card[1],
                theme: card[2],
                description: card[3],
                imageUrl: card[4],
                contentWarning: card[5],
                players: card[6],
                sessions: card[7],
                playMode: card[8],
                cost: '0.00€'
              };
            };
            cards = cards.map(_parseData)

            console.log('CARDs', cards);

            _showSubTitleMenuHtml(_renderSubtitleHtml(_allSubTitles(cards)));
            _showCardsHtml(_renderCardsHtml(cards));

            jQuery('#subtitle-menu-content .ui.button').on('click', (event) => {
              // event.stopPropagation();
              // event.preventDefault();

              const subTitle = jQuery(event.currentTarget).data('value');
              _deactivateAllSubTitleMenu();
              _clearCardsHtml();
              _showCardsHtml(_renderCardsHtml(_filterCardsBy(subTitle)(cards)));
              _activateSubTitleMenu(event.currentTarget);
              return false;
            });
          },
          error: function(xhr, status, error) {
              console.error('Download failed:', error);
          }
        });
      });
    </script>
  </body>
</html>
